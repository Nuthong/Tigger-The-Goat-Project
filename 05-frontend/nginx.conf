server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # security headers (mirror the API's — see ../SECURITY.md §3)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: https://images.unsplash.com; media-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" always;

  # cache built assets, never the HTML shell
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  # fonts are stable - cache hard
  location ~* \.woff2?$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  # hero clips live at a fixed name and get swapped in place - always
  # revalidate (ETag) so a new encode is picked up without a stale 30-day cache
  location ~* \.(mp4|webm)$ {
    add_header Cache-Control "no-cache";
  }

  # proxy API to the backend service (compose service name: api)
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }
}
